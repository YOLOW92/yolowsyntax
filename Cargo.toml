[package]
name = "yolowsyntax"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Pure-Rust tree-sitter grammar runtime and code outline extractor (symbols, imports, sections) for 41 languages."
license = "MIT"
repository = "https://github.com/YOLOW92/yolowsyntax"
readme = "README.md"
keywords = ["tree-sitter", "parser", "syntax", "ast", "outline"]
categories = ["parsing", "text-processing"]
include = [
    "src/**",
    "tables/*.pslg.z",
    "tests/**",
    "examples/**",
    "THIRD-PARTY.md",
    "LICENSE",
    "README.md",
    "Cargo.toml",
]

[features]
# Converter, corpus validation, and CLI tools; disabled by default.
tools = []

[dependencies]
yolowzstd = "0.1.2"

[[bin]]
name = "ts-convert"
path = "src/bin/ts-convert.rs"
required-features = ["tools"]

[[bin]]
name = "ts-corpus"
path = "src/bin/ts-corpus.rs"
required-features = ["tools"]

[[bin]]
name = "ts-parse"
path = "src/bin/ts-parse.rs"
required-features = ["tools"]

[[test]]
name = "grammars"
required-features = ["tools"]

[[test]]
name = "json"
required-features = ["tools"]

[profile.release]
lto = "fat"
codegen-units = 1
